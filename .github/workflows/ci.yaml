name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: coc-test (${{ matrix.editor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [nvim, vim]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # coc-test 0.2.0 does not authenticate its GitHub API downloads.
      - name: Check out coc.nvim release
        uses: actions/checkout@v6
        with:
          repository: neoclide/coc.nvim
          ref: release
          path: .coc-nvim
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install editors
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim vim

      - name: Typecheck
        run: npm run lint

      - name: Integration tests (${{ matrix.editor }})
        env:
          COC_TEST_COC_PATH: ${{ github.workspace }}/.coc-nvim
        run: npm run test:integration:${{ matrix.editor }}
